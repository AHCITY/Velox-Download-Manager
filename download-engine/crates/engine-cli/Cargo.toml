[package]
name = "engine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Velox command-line client for the download engine"

[[bin]]
name = "velox"
path = "src/main.rs"

[dependencies]
engine-core = { path = "../engine-core" }
engine-http = { path = "../engine-http" }
engine-api = { path = "../engine-api" }
engine-bridge = { path = "../engine-bridge" }
engine-media = { path = "../engine-media" }
engine-torrent = { path = "../engine-torrent" }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
engine-testserver = { path = "../engine-testserver" }
engine-state = { path = "../engine-state" }
tempfile = { workspace = true }
