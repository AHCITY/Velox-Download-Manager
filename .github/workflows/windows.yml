# Windows compatibility gate — verifies the COMPLETE workspace on a real Windows runner,
# and builds the desktop application + NSIS installer as a separate, gated job.
# NO Windows-support claim may be made before these run green on a push/PR.
name: windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- Job 1: engine gates (every PR and push) ----
  # The cargo workspace lives in download-engine/ — every run step executes there.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: download-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Unit + integration tests (workspace, incl. cfg(windows) lock-crash-recovery test)
        run: cargo test --workspace --no-fail-fast

      - name: Frontend unit tests (node:test)
        working-directory: download-engine/web
        run: node --test

      - name: Desktop-app unit tests (velox-app — browser detection, host-manifest probe)
        # velox-app is a standalone crate (not in the engine workspace) and can
        # only be compiled where the Tauri stack exists — the Windows runner.
        working-directory: download-engine/app/src-tauri
        run: cargo test

      - name: CLI startup/shutdown smoke (v1 stdio, portable ctrl_c path)
        shell: pwsh
        run: |
          cargo run -p engine-cli --bin velox -- version
          '{"jsonrpc":"2.0","id":1,"method":"engine.info"}' | cargo run -q -p engine-cli --bin velox -- serve

      - name: API v2 smoke — serve-http startup, RPC round-trip, Host guard, clean shutdown
        shell: pwsh
        run: |
          cargo build --release -p engine-cli
          $p = Start-Process -FilePath target\release\velox.exe `
            -ArgumentList "serve-http","--bind","127.0.0.1","--port","31987" `
            -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $body = '{"jsonrpc":"2.0","id":1,"method":"engine.info"}'
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:31987/rpc" -Method Post `
                 -ContentType "application/json" -Body $body -UseBasicParsing
          if ($r.Content -notmatch '"name":"velox"') { throw "engine.info failed: $($r.Content)" }
          # strict Host guard: a foreign Host must be refused (403)
          $refused = $false
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:31987/rpc" -Method Post `
              -ContentType "application/json" -Headers @{ Host = "evil.example" } `
              -Body $body -UseBasicParsing | Out-Null
          } catch { $refused = $true }
          if (-not $refused) { throw "foreign Host was not refused" }
          Stop-Process -Id $p.Id -Force
          Write-Host "API v2 smoke: OK"

      # --test-threads=1: each of these tests spawns real velox children + servers;
      # serialized they stay within windows-runner time budgets (Defender scans on
      # freshly built exes make parallel spawns flaky — 2026-11-21 CI evidence)
      - name: Crash-recovery focus (windows lock variant + resume tests)
        run: |
          cargo test -p engine-storage -- --exact tests::lock_recovered_after_child_process_death
          cargo test -p engine-cli --test crash_resume -- --test-threads=1

  # ---- Job 2: desktop application + UNIFIED installer ----
  # Manual dispatch for development builds; every v* tag builds the RELEASE
  # artifacts. The unified NSIS template (scripts/installer-unified-template.nsi)
  # installs EVERYTHING — Velox.exe, browser extension, velox-browser-host.exe,
  # yt-dlp, LGPL ffmpeg/ffprobe, WebView2 fallback, licenses — one complete
  # installer, which is also the signed auto-updater payload.
  desktop:
    needs: windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        # the app sources live in download-engine/ (same root as the engine job)
        working-directory: download-engine
    env:
      STAGING: ${{ github.workspace }}\staging
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependencies with the committed Cargo.lock (reproducibility gate)
        shell: pwsh
        run: |
          cd app\src-tauri
          if (-not (Test-Path Cargo.lock)) { throw "app/src-tauri/Cargo.lock is missing — commit it" }
          cargo fetch --locked

      - name: Build Velox desktop app (release, updater-enabled)
        shell: pwsh
        run: |
          cd app\src-tauri
          cargo build --release --features custom-protocol
          $exe = "target\release\Velox.exe"
          if (-not (Test-Path $exe)) { throw "Velox.exe was not produced — check the [[bin]] name = Velox target" }
          Write-Host "app exe: $((Get-Item $exe).Length) bytes"

      - name: Build + stage the native messaging host from the workspace
        shell: pwsh
        run: |
          cargo build --release -p velox-host
          New-Item -ItemType Directory -Force "$env:STAGING" | Out-Null
          Copy-Item "target\release\velox-browser-host.exe" "$env:STAGING\"
          Write-Host "velox-browser-host.exe: $((Get-Item "$env:STAGING\velox-browser-host.exe").Length) bytes"

      - name: Stage bundled components (yt-dlp, LGPL ffmpeg/ffprobe, WebView2 fallback)
        shell: pwsh
        run: |
          # yt-dlp: official signed release binary
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$env:STAGING\yt-dlp.exe"
          # ffmpeg/ffprobe: BtbN LGPL build (redistributable, no GPL taint)
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip" -OutFile "$env:STAGING\ffmpeg.zip"
          Expand-Archive "$env:STAGING\ffmpeg.zip" "$env:STAGING\ffmpeg" -Force
          Copy-Item (Get-ChildItem "$env:STAGING\ffmpeg" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1).FullName "$env:STAGING\ffmpeg.exe"
          Copy-Item (Get-ChildItem "$env:STAGING\ffmpeg" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1).FullName "$env:STAGING\ffprobe.exe"
          $lic = Get-ChildItem "$env:STAGING\ffmpeg" -Recurse -Filter "LICENSE*" | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName "$env:STAGING\ffmpeg-lgpl-LICENSE.txt" }
          # WebView2 fallback: Evergreen Bootstrapper (official fwlink, ~2 MB;
          # runs only on machines whose WebView2 runtime is genuinely missing)
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?LinkId=2124703" -OutFile "$env:STAGING\MicrosoftEdgeWebview2Setup.exe"
          # extension + notices from the repository
          Copy-Item "$env:GITHUB_WORKSPACE\download-engine\extension" "$env:STAGING\extension" -Recurse
          Copy-Item "$env:GITHUB_WORKSPACE\download-engine\docs\THIRD_PARTY_NOTICES.md" "$env:STAGING\THIRD_PARTY_NOTICES.md"
          Copy-Item "app\src-tauri\target\release\Velox.exe" "$env:STAGING\Velox.exe"
          Get-ChildItem "$env:STAGING" | Select-Object Name, Length

      - name: Install NSIS (makensis for the unified installer)
        # windows-latest runners do NOT ship NSIS — install it, with a direct
        # setup-exe fallback in case the chocolatey feed is flaky.
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            Write-Host "choco install did not produce makensis — direct NSIS setup fallback"
            Invoke-WebRequest -Uri "https://downloads.sourceforge.net/nsis/nsis-3.10-setup.exe" -OutFile nsis-setup.exe
            Start-Process -FilePath ".\nsis-setup.exe" -ArgumentList "/S" -Wait -NoNewWindow
          }
          if (-not (Test-Path $nsis)) { throw "makensis still missing at $nsis after install" }
          & $nsis -VERSION

      - name: Build the unified NSIS installer (makensis, updater-signed)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -match '^[0-9]+\.[0-9]+\.[0-9]+$') { Write-Host "tag version $ver" }
          else { $conf = Get-Content app\src-tauri\tauri.conf.json -Raw | ConvertFrom-Json; $ver = $conf.version; Write-Host "config version $ver (no tag version)" }
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { throw "makensis not found at $nsis" }
          $keyPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\velox-updater.key'
          $key = (Get-Content $keyPath -Last 1).Trim()
          if ([string]::IsNullOrWhiteSpace($key)) { throw "updater key is empty at $keyPath" }
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          & $nsis `
            "/DPRODUCT_VERSION=$ver" `
            "/DBUILD_STAGING=$env:STAGING" `
            "/DBUILD_OUTPUT=$env:STAGING\Velox-Setup-x64-unified.exe" `
            "/DBUILD_ICON_DIR=$env:GITHUB_WORKSPACE\download-engine\app\src-tauri\icons" `
            "$env:GITHUB_WORKSPACE\scripts\installer-unified-template.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with $LASTEXITCODE" }
          # sign the EXACT installer bytes the updater will verify (minisign,
          # trusted-comment version binding checked by require_signed_version)
          npm install -g "@tauri-apps/cli@^2"
          tauri signer sign --app-version $ver "$env:STAGING\Velox-Setup-x64-unified.exe"
          if (-not (Test-Path "$env:STAGING\Velox-Setup-x64-unified.exe.sig")) { throw "updater signature missing — TAURI_SIGNING_PRIVATE_KEY was not picked up" }
          Copy-Item "$env:STAGING\Velox-Setup-x64-unified.exe" .
          Copy-Item "$env:STAGING\Velox-Setup-x64-unified.exe.sig" .

      - name: Verify the installer actually contains every required component
        shell: pwsh
        run: |
          $seven = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $seven)) { throw "7-Zip not found at $seven" }
          $listing = & $seven l Velox-Setup-x64-unified.exe
          # NSIS stores the payload flat: the template installs every extension
          # file with /oname= directly into $INSTDIR (manifest.json, README.md,
          # icons...) — there is no "extension/" directory inside the archive,
          # so the required list uses the FLAT installed names.
          $required = @(
            "Velox.exe", "velox-browser-host.exe", "yt-dlp.exe",
            "ffmpeg.exe", "ffprobe.exe", "manifest.json",
            "background.js", "popup.html", "popup.js", "README.md",
            "THIRD-PARTY-NOTICES.md", "FFMPEG-LICENSE.txt", "WebView2Setup"
          )
          $missing = @()
          foreach ($r in $required) {
            if (-not ($listing -match [regex]::Escape($r))) { $missing += $r }
          }
          if ($missing.Count) { throw "unified installer is INCOMPLETE — missing: $($missing -join ', ')" }
          Write-Host "unified installer contents verified: $($required -join ', ')"
          $size = [math]::Round((Get-Item Velox-Setup-x64-unified.exe).Length / 1MB, 1)
          Write-Host "Velox-Setup-x64-unified.exe: $size MB"

      - name: Upload unified installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velox-Setup-x64-unified
          path: download-engine/Velox-Setup-x64-unified.exe
          if-no-files-found: error

      - name: Upload unified installer signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velox-Setup-x64-unified.sig
          path: download-engine/Velox-Setup-x64-unified.exe.sig
          if-no-files-found: error

  # ---- Job 3: publish the signed release (v* tags only) ----
  # The release page stays CLEAN: one obvious installer download (the unified
  # setup) plus exactly what the signed auto-updater requires — latest.json
  # (tag-pinned URL), the minisign .sig and SHA256SUMS.txt. Nothing else.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: rel
      - name: Assemble release assets (latest.json + checksums)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp rel/Velox-Setup-x64-unified/Velox-Setup-x64-unified.exe out/
          cp rel/Velox-Setup-x64-unified.sig/Velox-Setup-x64-unified.exe.sig out/
          SIG=$(cat out/Velox-Setup-x64-unified.exe.sig)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Velox-Setup-x64-unified.exe"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg v "$VER" --arg s "$SIG" --arg u "$URL" --arg d "$PUB_DATE" \
            '{version:$v, notes:("Velox "+$v+" — see the release notes for changes."), pub_date:$d, platforms:{"windows-x86_64":{signature:$s, url:$u}}}' \
            > out/latest.json
          (cd out && sha256sum Velox-Setup-x64-unified.exe Velox-Setup-x64-unified.exe.sig latest.json > SHA256SUMS.txt)
          cat out/latest.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Velox ${GITHUB_REF_NAME#v}" \
            --notes "Unified signed installer — Velox desktop app, browser extension + native messaging host, yt-dlp, LGPL ffmpeg/ffprobe and the WebView2 fallback in ONE package. The in-app updater offers this release automatically; new users download **Velox-Setup-x64-unified.exe**. SHA256SUMS.txt covers the installer, its signature and latest.json."
