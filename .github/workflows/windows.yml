# Windows compatibility gate — verifies the COMPLETE workspace on a real Windows runner,
# and builds the desktop application + NSIS installer as a separate, gated job.
# NO Windows-support claim may be made before these run green on a push/PR.
name: windows
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ---- Job 1: engine gates (every PR and push) ----
  # The cargo workspace lives in download-engine/ — every run step executes there.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: download-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (workspace, all targets)
        run: cargo build --workspace --all-targets

      - name: Unit + integration tests (workspace, incl. cfg(windows) lock-crash-recovery test)
        run: cargo test --workspace --no-fail-fast

      - name: Frontend unit tests (node:test)
        working-directory: download-engine/web
        run: node --test

      - name: CLI startup/shutdown smoke (v1 stdio, portable ctrl_c path)
        shell: pwsh
        run: |
          cargo run -p engine-cli --bin velox -- version
          '{"jsonrpc":"2.0","id":1,"method":"engine.info"}' | cargo run -q -p engine-cli --bin velox -- serve

      - name: API v2 smoke — serve-http startup, RPC round-trip, Host guard, clean shutdown
        shell: pwsh
        run: |
          cargo build --release -p engine-cli
          $p = Start-Process -FilePath target\release\velox.exe `
            -ArgumentList "serve-http","--bind","127.0.0.1","--port","31987" `
            -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $body = '{"jsonrpc":"2.0","id":1,"method":"engine.info"}'
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:31987/rpc" -Method Post `
                 -ContentType "application/json" -Body $body -UseBasicParsing
          if ($r.Content -notmatch '"name":"velox"') { throw "engine.info failed: $($r.Content)" }
          # strict Host guard: a foreign Host must be refused (403)
          $refused = $false
          try {
            Invoke-WebRequest -Uri "http://127.0.0.1:31987/rpc" -Method Post `
              -ContentType "application/json" -Headers @{ Host = "evil.example" } `
              -Body $body -UseBasicParsing | Out-Null
          } catch { $refused = $true }
          if (-not $refused) { throw "foreign Host was not refused" }
          Stop-Process -Id $p.Id -Force
          Write-Host "API v2 smoke: OK"

      # --test-threads=1: each of these tests spawns real velox children + servers;
      # serialized they stay within windows-runner time budgets (Defender scans on
      # freshly built exes make parallel spawns flaky — 2026-11-21 CI evidence)
      - name: Crash-recovery focus (windows lock variant + resume tests)
        run: |
          cargo test -p engine-storage -- --exact tests::lock_recovered_after_child_process_death
          cargo test -p engine-cli --test crash_resume -- --test-threads=1

  # ---- Job 2: desktop application + installer ----
  # Manual dispatch for development builds; every v* tag builds the RELEASE
  # artifacts: updater-signed installer + latest.json + extension zip, published
  # by Job 3. Sources and Cargo.lock ARE tracked (download-engine/app/src-tauri),
  # so the reproducibility gate below can run.
  desktop:
    needs: windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    defaults:
      run:
        # the app sources live in download-engine/ (same root as the engine job)
        working-directory: download-engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve dependencies with the committed Cargo.lock (reproducibility gate)
        shell: pwsh
        run: |
          cd app\src-tauri
          if (-not (Test-Path Cargo.lock)) { throw "app/src-tauri/Cargo.lock is missing — commit it" }
          cargo fetch --locked

      - name: Build Velox desktop app + NSIS installer (tauri-cli, updater-signed)
        shell: pwsh
        run: |
          cargo install tauri-cli --version "^2" --locked
          # the updater only signs when the private key env is present; the key is
          # tracked in the repo (dev-build convention, like the extension key)
          $key = (Get-Content ..\..\scripts\velox-updater.key -Last 1).Trim()
          $env:TAURI_SIGNING_PRIVATE_KEY = $key
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
          cd app\src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc
          ls target\x86_64-pc-windows-msvc\release\bundle\nsis\

      - name: Verify the installed-app executable and the setup executable are distinct artifacts
        shell: pwsh
        run: |
          $app = Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\Velox.exe" -ErrorAction SilentlyContinue
          if (-not $app) { throw "Velox.exe (application) was not produced — check the [[bin]] name = Velox target" }
          if ((Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\*.exe").Count -lt 1 -or $app.Name -ne "Velox.exe") { throw "binary name is not Velox.exe" }
          $setup = Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS setup executable was not produced" }
          Write-Host "application exe: $($app.FullName) ($([math]::Round($app.Length/1MB,1)) MB)"
          Write-Host "installer exe:   $($setup.FullName) ($([math]::Round($setup.Length/1MB,1)) MB)"

      - name: Normalize artifact name
        shell: pwsh
        run: |
          $setup = Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName Velox-Setup-x64.exe
          Copy-Item "app\src-tauri\target\x86_64-pc-windows-msvc\release\Velox.exe" Velox-app-x64.exe
          # the minisign signature travels with the installer (validates the file
          # CONTENT, so the rename below does not affect verification)
          Copy-Item "$($setup.FullName).sig" Velox-Setup-x64.exe.sig
          if (-not (Test-Path Velox-Setup-x64.exe.sig)) { throw "updater signature missing — TAURI_SIGNING_PRIVATE_KEY was not picked up" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velox-Setup-x64
          path: download-engine/Velox-Setup-x64.exe
          if-no-files-found: error

      - name: Upload installer signature artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velox-Setup-x64.sig
          path: download-engine/Velox-Setup-x64.exe.sig
          if-no-files-found: error

      - name: Upload application executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velox-app-x64
          path: download-engine/Velox-app-x64.exe
          if-no-files-found: error

  # ---- Job 3: publish the signed release (v* tags only) ----
  # Assembles and publishes everything the in-app updater and a fresh user
  # need: Velox-Setup-x64.exe (+ minisign .sig), latest.json (updater manifest
  # with a tag-pinned asset URL), the browser extension zip and SHA256SUMS.txt.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: rel
      - name: Assemble release assets (latest.json + extension zip + checksums)
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp rel/Velox-Setup-x64/Velox-Setup-x64.exe out/
          cp rel/Velox-Setup-x64.sig/Velox-Setup-x64.exe.sig out/
          cp rel/Velox-app-x64/Velox-app-x64.exe out/
          SIG=$(cat out/Velox-Setup-x64.exe.sig)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Velox-Setup-x64.exe"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg v "$VER" --arg s "$SIG" --arg u "$URL" --arg d "$PUB_DATE" \
            '{version:$v, notes:("Velox "+$v+" — see the release notes for changes."), pub_date:$d, platforms:{"windows-x86_64":{signature:$s, url:$u}}}' \
            > out/latest.json
          (cd download-engine/extension && zip -qr "$GITHUB_WORKSPACE/out/Velox-Extension.zip" .)
          (cd out && sha256sum Velox-Setup-x64.exe Velox-Setup-x64.exe.sig Velox-app-x64.exe Velox-Extension.zip > SHA256SUMS.txt)
          cat out/latest.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "Velox ${GITHUB_REF_NAME#v}" \
            --notes "Signed NSIS installer + updater manifest (latest.json) + browser extension zip. The in-app updater offers this release automatically; new users download Velox-Setup-x64.exe."
